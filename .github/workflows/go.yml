name: Go

on:
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: webapp

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webapp/go.mod
          cache-dependency-path: webapp/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race + cover)
        run: go test ./... -race -cover

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
