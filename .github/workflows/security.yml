name: Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dependency + secret scan. BLOCKS on HIGH/CRITICAL fixable findings.
      - uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # IaC / Dockerfile / k8s misconfig scan. ADVISORY for now (exit-code 0) —
      # several k8s findings are deliberately deferred (see docs/CI.md and the
      # security-review phases). Flip exit-code to "1" once the baseline is
      # triaged into .trivyignore.
      - uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    continue-on-error: true # advisory
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: webapp/Dockerfile
          config: .hadolint.yaml
