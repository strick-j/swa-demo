---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swa-demo-webapp
  namespace: swa-demo
  labels:
    app: swa-demo-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swa-demo-webapp
  template:
    metadata:
      labels:
        app: swa-demo-webapp
    spec:
      serviceAccountName: swa-demo-webapp
      containers:
        - name: webapp
          image: swa-demo-webapp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WEBAPP_JWT_AUDIENCE
              value: "swa-demo-audience"
            - name: SWA_TRUST_DOMAIN
              value: "swa-demo.example.com"
            - name: NS_DEMO
              value: "swa-demo"
            - name: WEBAPP_SA
              value: "swa-demo-webapp"
            - name: SWA_NODE_GROUP
              value: "minikube-nodes"
            # Workload API socket exposed by the SWA Agent DaemonSet hostPath.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///tmp/swa-agent/public/api.sock"
            # Set to "true" to force the visual demo without a live agent.
            - name: DEMO_MODE
              value: "false"
            # The unauthorized probe pod; the webapp calls its /probe server-side
            # to show the denied DB result alongside its own authorized read.
            - name: PROBE_URL
              value: "http://untrusted-app.swa-demo-untrusted.svc.cluster.local:8080/probe"
            # Probe pods' /probe-svid endpoints, relayed to populate the scenario
            # switcher: the untrusted app (valid SVID, denied at the gateway) and
            # the unknown app (no registration policy — refused an SVID entirely).
            - name: UNTRUSTED_SVID_URL
              value: "http://untrusted-app.swa-demo-untrusted.svc.cluster.local:8080/probe-svid"
            - name: UNKNOWN_SVID_URL
              value: "http://rogue-app.swa-demo-rogue.svc.cluster.local:8080/probe-svid"
            # The foreign-trust-domain carrier (acme.courier). The webapp dials it
            # over mTLS with the SWA trust bundle and is rejected at the boundary.
            - name: FOREIGN_CARRIER_ADDR
              value: "foreign-carrier.acme-external.svc.cluster.local:8443"
            # --- Secrets Manager page (Conjur authn-jwt) ---
            # The Conjur page runs in SIMULATED mode until these are set (tenant
            # URL is environment-specific, so it's not committed here). To go
            # live, set CONJUR_APPLIANCE_URL + CONJUR_JWT_SECRET_PATH (ideally
            # from a ConfigMap/Secret) and configure the authn-jwt authenticator.
            # - name: CONJUR_APPLIANCE_URL
            #   value: "https://<tenant>.secretsmgr.cyberark.cloud/api"
            # - name: CONJUR_ACCOUNT
            #   value: "conjur"
            - name: CONJUR_AUTHN_JWT_SERVICE_ID
              value: "authn-jwt/swa"
            - name: CONJUR_JWT_SECRET_PATH
              value: "data/secrets/demo-db-password"
            - name: CONJUR_JWT_AUDIENCE
              value: "conjur"
            # --- Secrets Manager page (Conjur authn-iam / AWS STS) ---
            # The AWS STS tab runs SIMULATED until the IAM service id + host id
            # are set (and CONJUR_APPLIANCE_URL above is uncommented). AWS creds
            # come from the default chain — on EC2 that's the node instance
            # profile via IMDS, which requires the metadata hop limit = 3 (pod is
            # two hops from the host under minikube) so the pod can reach
            # 169.254.169.254 (set in terraform ec2.tf). The Conjur
            # host id is whatever your authn-iam policy maps the caller ARN to.
            # - name: CONJUR_AUTHN_IAM_SERVICE_ID
            #   value: "swa"            # bare service id -> authn-iam/swa
            # - name: CONJUR_IAM_HOST_ID
            #   value: "data/aws/swa-demo-webapp"
            # - name: CONJUR_IAM_SECRET_PATH
            #   value: "data/secrets/demo-db-password"
            # - name: AWS_REGION
            #   value: "us-east-1"
            # --- Credential Providers page (CCP / AIMWebService) ---
            # Client cert for mTLS to the CCP. The files come from the OPTIONAL
            # ccp-client-tls Secret mounted below (create it with
            # scripts/gen-ccp-cert.sh); if the Secret is absent the CCP tabs run
            # simulated. The rest of the CCP config (CCP_BASE_URL, CCP_APP_ID,
            # safes/objects, CCP_DUAL_QUERY, CCP_INSECURE_SKIP_VERIFY) is injected
            # from .env by deploy-webapp.sh.
            - name: CCP_CLIENT_CERT
              value: "/etc/ccp/tls.crt"
            - name: CCP_CLIENT_KEY
              value: "/etc/ccp/tls.key"
          volumeMounts:
            - name: swa-agent-socket
              mountPath: /tmp/swa-agent
              readOnly: true
            - name: ccp-client-tls
              mountPath: /etc/ccp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        # The SWA Agent DaemonSet exposes the Workload API socket on this hostPath.
        - name: swa-agent-socket
          hostPath:
            path: /tmp/swa-agent
            type: Directory
        # Client cert for mTLS to the CCP. optional:true so the pod still starts
        # when the Secret is absent (CCP tabs run simulated until you create it
        # with scripts/gen-ccp-cert.sh).
        - name: ccp-client-tls
          secret:
            secretName: ccp-client-tls
            optional: true
