---
# S3 URI (bucket/prefix) holding the CyberArk Credential Provider (AAM) installer
# zip, passed via -e from the Makefile. Empty => role is skipped.
cp_installer_s3_uri: ""
# AWS region for the s3 client (instance profile supplies credentials).
aws_region: "us-east-1"
# Where the installer lands on the host. The install itself is run manually from
# here — this role only keeps the artifact present across host rebuilds.
cp_installer_local_dir: "/home/{{ minikube_user }}/cp-installer"
