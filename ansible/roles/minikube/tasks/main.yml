---
# Install minikube and start a single-node cluster as the (non-root) login user.
# The docker driver must NOT run as root, so cluster tasks use become_user.

# minikube publishes a bare digest (no filename) in its .sha256, so get_url's
# checksum-URL mode can't match it to the binary. Fetch the digest first and
# pass it inline instead — still verified, still version-driven.
- name: Fetch minikube SHA-256 digest
  ansible.builtin.uri:
    url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64.sha256"
    return_content: true
  register: minikube_sha

- name: Install minikube binary
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
    # Verify against the release's published SHA-256 (fetched at run time, so no
    # hash to maintain here). TLS authenticates the host; this authenticates the
    # artifact.
    checksum: "sha256:{{ minikube_sha.content | trim }}"
    dest: /usr/local/bin/minikube
    mode: "0755"
    owner: root
    group: root

- name: Check minikube status
  ansible.builtin.command: minikube status --format '{{ "{{" }}.Host{{ "}}" }}'
  become: true
  become_user: "{{ minikube_user }}"
  register: mk_status
  failed_when: false
  changed_when: false
  environment:
    MINIKUBE_HOME: "/home/{{ minikube_user }}/.minikube"

- name: Start minikube (docker driver)
  ansible.builtin.command: >-
    minikube start
    --driver=docker
    --kubernetes-version={{ minikube_k8s_version }}
    --cpus={{ minikube_cpus }}
    --memory={{ minikube_memory }}
    --addons={{ minikube_addons | join(',') }}
  become: true
  become_user: "{{ minikube_user }}"
  register: mk_start
  changed_when: "'Done!' in mk_start.stdout or 'Starting' in mk_start.stdout"
  when: mk_status.stdout != "Running"
  environment:
    MINIKUBE_HOME: "/home/{{ minikube_user }}/.minikube"

- name: Wait for the node to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=180s
  become: true
  become_user: "{{ minikube_user }}"
  register: node_ready
  changed_when: false
  retries: 3
  delay: 10
  until: node_ready.rc == 0

- name: Show cluster info
  ansible.builtin.command: kubectl get nodes -o wide
  become: true
  become_user: "{{ minikube_user }}"
  changed_when: false
  register: nodes_out

- name: Report nodes
  ansible.builtin.debug:
    var: nodes_out.stdout_lines

# --- Boot persistence -------------------------------------------------------
# A stop/start (power cycle) leaves minikube Stopped and drops any transient
# NodePort bridge, so the demo comes back 502 until someone reruns things by
# hand. These two units make the stack self-heal on boot: minikube starts after
# docker, then the socat bridge starts after minikube and re-resolves the
# (possibly changed) minikube IP on every (re)start.
- name: Install minikube autostart unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/swa-minikube.service
    mode: "0644"
    content: |
      [Unit]
      Description=Start minikube (docker driver) on boot
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      User={{ minikube_user }}
      Environment=HOME=/home/{{ minikube_user }}
      Environment=MINIKUBE_HOME=/home/{{ minikube_user }}/.minikube
      ExecStart=/usr/local/bin/minikube start
      ExecStop=/usr/local/bin/minikube stop
      TimeoutStartSec=600

      [Install]
      WantedBy=multi-user.target

# The bridge command lives in a wrapper script rather than inline in ExecStart:
# systemd would otherwise try to expand $MK / $(...) itself before the shell runs,
# and the one-liner exceeds the yaml line-length limit. The script re-resolves the
# minikube IP (which can change across restarts) on every start; PORT comes from
# the unit's Environment.
- name: Install webapp NodePort bridge script
  ansible.builtin.copy:
    dest: /usr/local/bin/swa-webapp-forward
    mode: "0755"
    content: |
      #!/bin/sh
      # Forward host:PORT -> minikube:PORT (docker-driver NodePort lives on the
      # minikube container IP, not the host interface). PORT is set by the unit.
      set -eu
      MK="$(/usr/local/bin/minikube ip)"
      exec /usr/bin/socat "TCP-LISTEN:${PORT},fork,reuseaddr" "TCP:${MK}:${PORT}"

- name: Install webapp NodePort bridge unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/swa-webapp-forward.service
    mode: "0644"
    content: |
      [Unit]
      Description=Forward host NodePort to minikube (webapp bridge)
      After=swa-minikube.service
      Requires=swa-minikube.service

      [Service]
      User={{ minikube_user }}
      Environment=HOME=/home/{{ minikube_user }}
      Environment=MINIKUBE_HOME=/home/{{ minikube_user }}/.minikube
      Environment=PORT={{ webapp_nodeport | default(30080) }}
      ExecStart=/usr/local/bin/swa-webapp-forward
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Enable minikube + webapp bridge on boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - swa-minikube.service
    - swa-webapp-forward.service
