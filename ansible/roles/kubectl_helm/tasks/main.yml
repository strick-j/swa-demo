---
# Install kubectl and helm system-wide.

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    # Verify against Kubernetes' published SHA-256 for this exact release.
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
    dest: /usr/local/bin/kubectl
    mode: "0755"
    owner: root
    group: root

# Install helm by extracting the release tarball directly. The official
# get-helm-3 script verifies helm is on $PATH after install and exits non-zero
# when /usr/local/bin isn't on the (non-login) shell PATH, even though the binary
# installed fine — so we avoid it.
- name: Check whether helm is installed
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_check
  failed_when: false
  changed_when: false

# Fetch the tarball with checksum verification FIRST (unarchive can't verify a
# remote source), then extract the local, verified file. dest basename matches
# the name listed in helm's .sha256sum so get_url can match the right line.
- name: Download helm tarball (verified)
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
    dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    mode: "0644"
  when: helm_check.rc != 0

- name: Extract helm
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: helm_check.rc != 0

- name: Install helm binary into /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  when: helm_check.rc != 0
